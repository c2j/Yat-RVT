name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ──────────────────────────────────────
          - name: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64

          - name: Windows ARM64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows-arm64

          # ── Linux ────────────────────────────────────────
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64

          # NOTE: ubuntu-24.04-arm requires GitHub Free (public repos) or GitHub Team (private repos).
          # If unavailable, remove this entry or use cross-compilation with Docker.
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64

          # ── macOS ────────────────────────────────────────
          # macOS Intel runner deprecated; cross-compile x86_64 on ARM runner
          - name: macOS x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64

          - name: macOS ARM64
            runner: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ── Cache ──────────────────────────────────────────

      - name: Cache Cargo registry and git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      # ── Platform dependencies ─────────────────────────

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf libsoup2.4-dev

      # ── Build ──────────────────────────────────────────

      - name: Install npm dependencies
        run: npm install

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'App ${{ github.ref_name }}'
          releaseBody: |
            See the assets below to download the installer for your platform.

            **Windows:** `.msi` or `-setup.exe` files
            **Linux:** `.deb` or `.AppImage`
            **macOS:** `.dmg`
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # ── Upload artifacts for debugging ────────────────

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifacts
          retention-days: 7
          if-no-files-found: warn
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
