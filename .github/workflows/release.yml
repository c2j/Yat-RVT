name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x86_64
            os: windows
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            os: linux
          - platform: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            arch: arm64
            os: linux
          - platform: macos-latest
            target: x86_64-apple-darwin
            arch: x86_64
            os: macos
          - platform: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
            os: macos

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm install

      - name: Build Tauri App
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'App ${{ github.ref_name }}'
          releaseBody: |
            ## Release ${{ github.ref_name }}

            ### Installation

            Download the appropriate binary for your platform:

            **Windows:**
            - Download `Tauri React App_${{ github.ref_name }}_x64-setup.exe` or `Tauri React App_${{ github.ref_name }}_x64_zh-CN.msi`

            **Linux:**
            - x86_64: Download `.deb` or `.AppImage` file
            - ARM64: Download `.deb` or `.AppImage` file

            **macOS:**
            - Intel: Download `Tauri React App_${{ github.ref_name }}_x64.dmg`
            - Apple Silicon: Download `Tauri React App_${{ github.ref_name }}_aarch64.dmg`

            ### Changelog
            See the full changelog for details.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
